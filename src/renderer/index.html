<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Renderer makes no fetch/XHR/WebSocket calls (IPC only), so connect-src is
         'none'. Previews ship as data:/blob: images; gallery thumbs load through
         the app-registered thumb: protocol (FAZ 1.3b, main-side path guard).
         electron-vite dev replaces this tag for HMR (see electron.vite.config.ts);
         builds keep it verbatim. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: thumb:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>Byteback</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
