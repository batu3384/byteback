name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: wolf-recovery

jobs:
  typecheck:
    name: Type-check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wolf-recovery/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type-check renderer
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Type-check main process
        run: npx tsc --noEmit -p tsconfig.node.json

  build-windows:
    name: Build (Windows, native + Electron)
    runs-on: windows-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wolf-recovery/package-lock.json

      - name: Configure CMake
        run: cmake -S native -B native/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        shell: pwsh

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
        shell: pwsh

      - name: Build native engine
        run: npm run build:native

      - name: Verify native artifact
        run: |
          if (-Not (Test-Path native\build\Release\wolf_engine.node)) {
            throw "wolf_engine.node was not produced"
          }
        shell: pwsh

      - name: Build Electron app
        run: npm run build

      - name: Native unit tests
        run: |
          cmake -S native -B native/build -DWOLF_BUILD_TESTS=ON
          cmake --build native/build --config Release --target wolf_tests
          ctest --test-dir native/build -C Release --output-on-failure
        shell: pwsh

      - name: Upload native addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolf_engine-windows-x64
          path: wolf-recovery/native/build/Release/wolf_engine.node
          if-no-files-found: error
          retention-days: 14
